name: portfolio-bot

services:
  postgres:
    image: postgres:17.10-bookworm
    container_name: portfolio-bot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: portfolio-bot-app
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge